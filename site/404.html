<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Campgroundless has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://campgroundless.com/">
  <script>
    (function () {
      var path = location.pathname.replace(/^\/campgroundless(?=\/|$)/, "") || "/";
      location.replace("https://campgroundless.com" + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="2;url=https://campgroundless.com/">
</head>
<body>
  <p>Campgroundless has moved to <a href="https://campgroundless.com/">campgroundless.com</a>.</p>
</body>
</html>
